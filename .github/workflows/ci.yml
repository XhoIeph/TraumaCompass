name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run data:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build (with GitHub Pages basePath)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
